<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mon bébé en 3D (BioDigital) · Sérénaissance</title>
<link rel="stylesheet" href="style.css?v=114">
<style>
body{margin:0}
.b3-page{max-width:560px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.b3-test{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.b3-scene{position:relative;aspect-ratio:1/1;max-height:64vh;width:100%;border-radius:24px;overflow:hidden;background:#1b1114}
.b3-scene iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.b3-msg{position:absolute;inset:0;display:grid;place-items:center;padding:20px;text-align:center;color:#f6dfe3;font-weight:600}
.b3-nav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.b3-nav button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:1.4rem;cursor:pointer}
.b3-nav button:disabled{opacity:.35}
.b3-sem{text-align:center}.b3-sem h1{font-size:1.7rem}
.b3-sem .pill{display:inline-block;margin-top:4px;font-size:.75rem;font-weight:700;color:var(--sage,#6f8f7a);background:var(--soft);border-radius:99px;padding:2px 10px}
.b3-taille{margin:0;text-align:center;font-weight:600}
.b3-bloc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 16px}
.b3-bloc b{color:var(--accent)}.b3-bloc p{margin:4px 0 0}
.b3-date{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.b3-date input{flex:1;min-width:0;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.b3-date button{border:0;border-radius:12px;padding:10px 14px;background:var(--accent);color:#fff;font-weight:700}
.b3-note{font-size:.78rem;color:var(--muted);margin:0}
#bioDebug{font-size:.75rem;color:var(--muted);word-break:break-word;white-space:pre-wrap}
</style>
</head>
<body>
<main class="b3-page">
  <span class="b3-test">Page de test · bébé BioDigital</span>
  <div class="b3-scene" id="bioScene"><div class="b3-msg" id="bioMsg">Chargement de bébé…</div></div>
  <div class="b3-nav"><button id="b3Prev" aria-label="Semaine précédente">‹</button>
    <div class="b3-sem"><h1 id="b3Titre">Semaine 20</h1><span class="pill" id="b3Pill" hidden>Cette semaine</span></div>
    <button id="b3Next" aria-label="Semaine suivante">›</button></div>
  <div id="b3Texte" style="display:flex;flex-direction:column;gap:10px"></div>
  <label for="b3Dpa" style="font-weight:700">Date prévue d'accouchement (pour l'essai)</label>
  <div class="b3-date"><input type="date" id="b3Dpa"><button id="b3Ok">Mettre à jour</button></div>
  <p class="b3-note">Modèles 3D « Fetal Development » de BioDigital. Information générale : votre équipe de soins reste votre référence.</p>
  <p id="bioDebug" hidden></p>
</main>
<script src="bebe-donnees.js?v=114"></script>
<script src="bebe-3d.js?v=114"></script>
<script src="https://human-api.biodigital.com/build/1.2.1/human-api-1.2.1.min.js"></script>
<script>
/* ===== Réglages ===== */
/* Clé développeur BioDigital (créée sur developer.biodigital.com pour le site serenaissancedoula-hue.github.io). */
const BIO_DK='';
/* Un modèle par trimestre. Les semaines sont comptées depuis les dernières règles. */
const BIO_MODELES=[
  {de:4,a:13,id:'production/femaleAdult/fetal_development_trimester_1'},
  {de:14,a:27,id:'production/femaleAdult/fetal_development_trimester_2'},
  {de:28,a:42,id:'production/femaleAdult/fetal_development_trimester_3'}];
/* Après un premier essai, on peut associer chaque semaine à une étape précise du modèle : {12:'id-étape', ...} */
const BIO_ETAPES={};

const $=id=>document.getElementById(id),DAY=864e5,DBG=/debug/.test(location.search);
if(DBG)$('bioDebug').hidden=false;
const log=t=>{if(DBG)$('bioDebug').textContent+=t+'\n'};
let dpa=null;try{dpa=localStorage.getItem('sere-b3-dpa')}catch(e){}
if(!dpa)dpa=new Date(Date.now()+140*DAY).toISOString().slice(0,10);
$('b3Dpa').value=dpa;
function semaineActuelle(){const lmp=new Date(new Date(dpa+'T00:00:00').getTime()-280*DAY);return Math.max(4,Math.min(42,Math.floor((Date.now()-lmp)/DAY/7)+1))}
let actu=semaineActuelle(),w=actu,human=null,modele=null,chapitres=[];

function modelePour(w){return BIO_MODELES.find(m=>w>=m.de&&w<=m.a)||BIO_MODELES[BIO_MODELES.length-1]}
function charger(m){
  modele=m;chapitres=[];human=null;
  if(!BIO_DK){$('bioMsg').textContent='Il manque la clé BioDigital pour afficher bébé.';return}
  $('bioScene').innerHTML='<iframe id="bioWidget" title="Bébé en 3D" allowfullscreen src="https://human.biodigital.com/widget/?m='+encodeURIComponent(m.id)+'&dk='+encodeURIComponent(BIO_DK)+'&ui-info=false&ui-menu=false&ui-tools=false&ui-help=false&ui-share=false&ui-fullscreen=false&ui-nav=false&ui-zoom=false&ui-panel=false&ui-chapter-list=false&ui-tutorial=false&ui-loader=circle&disable-scroll=false"></iframe><div class="b3-msg" id="bioMsg">Chargement de bébé…</div>';
  try{human=new HumanAPI.Human('bioWidget')}catch(e){log('Erreur API : '+e);return}
  human.on('human.ready',()=>{const msg=$('bioMsg');if(msg)msg.remove();log('Modèle prêt : '+m.id);
    human.send('timeline.info',info=>{chapitres=(info&&info.chapters)||[];
      log('Étapes ('+chapitres.length+') : '+chapitres.map(c=>(c.title||c.name||'')+' ['+(c.chapterId||c.id)+']').join(' | '));
      allerSemaine(w)})});
}
function allerSemaine(w){if(!human||!chapitres.length)return;
  let id=BIO_ETAPES[w];
  if(!id){const i=Math.round((w-modele.de)/Math.max(1,modele.a-modele.de)*(chapitres.length-1));
    const c=chapitres[Math.max(0,Math.min(chapitres.length-1,i))];id=c.chapterId||c.id}
  human.send('timeline.set',{chapterId:id});log('Semaine '+w+' → étape '+id)}
function afficher(){$('b3Titre').textContent='Semaine '+w;$('b3Pill').hidden=(w!==actu);
  $('b3Prev').disabled=w<=4;$('b3Next').disabled=w>=42;$('b3Texte').innerHTML=bebe3dTexte(w);
  const m=modelePour(w);if(m!==modele)charger(m);else allerSemaine(w)}
$('b3Prev').onclick=()=>{w--;afficher()};$('b3Next').onclick=()=>{w++;afficher()};
$('b3Ok').onclick=()=>{const v=$('b3Dpa').value;if(!v)return;dpa=v;try{localStorage.setItem('sere-b3-dpa',v)}catch(e){}actu=semaineActuelle();w=actu;afficher()};
afficher();
</script>
</body>
</html>
