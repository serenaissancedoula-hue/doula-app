<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mon bébé en 3D · Sérénaissance</title>
<link rel="stylesheet" href="style.css?v=114">
<style>
body{margin:0}
.b3-page{max-width:560px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.b3-test{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.b3-scene{position:relative;aspect-ratio:1/1;max-height:62vh;width:100%;border-radius:24px;overflow:hidden;background:radial-gradient(circle at 50% 45%,#fbe3df,#e9b3ad 80%)}
.b3-iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.b3-charge{position:absolute;inset:0;display:grid;place-items:center;color:#7a3d3a;font-weight:600;pointer-events:none}
.b3-nav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.b3-nav button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:1.4rem;cursor:pointer}
.b3-nav button:disabled{opacity:.35}
.b3-sem{text-align:center}
.b3-sem h1{font-size:1.7rem}
.b3-sem .pill{display:inline-block;margin-top:4px;font-size:.75rem;font-weight:700;color:var(--sage,#6f8f7a);background:var(--soft);border-radius:99px;padding:2px 10px}
.b3-taille{margin:0;text-align:center;font-weight:600}
.b3-bloc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 16px}
.b3-bloc b{color:var(--accent)}
.b3-bloc p{margin:4px 0 0}
.b3-date{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.b3-date input{flex:1;min-width:0;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.b3-date button{border:0;border-radius:12px;padding:10px 14px;background:var(--accent);color:#fff;font-weight:700}
.b3-note{font-size:.78rem;color:var(--muted);margin:0}
.b3-peau{display:flex;flex-direction:column;gap:6px;font-weight:700}
.b3-sw{display:flex;gap:10px;flex-wrap:wrap}
.b3-sw button{width:40px;height:40px;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1px var(--line);cursor:pointer}
.b3-sw button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--accent)}
#b3Liste,#b3Debug{font-size:.75rem;color:var(--muted);word-break:break-word}
</style>
</head>
<body>
<main class="b3-page">
  <span class="b3-test">Page de test · bébé en 3D</span>
  <div class="b3-scene" id="b3Scene"></div>
  <div class="b3-peau"><span>Couleur de peau</span><div id="b3Peaux" class="b3-sw"></div></div>
  <div class="b3-nav"><button id="b3Prev" aria-label="Semaine précédente">‹</button>
    <div class="b3-sem"><h1 id="b3Titre">Semaine 20</h1><span class="pill" id="b3Pill" hidden>Cette semaine</span></div>
    <button id="b3Next" aria-label="Semaine suivante">›</button></div>
  <div id="b3Texte" style="display:flex;flex-direction:column;gap:10px"></div>
  <label for="b3Dpa" style="font-weight:700">Date prévue d'accouchement (pour l'essai)</label>
  <div class="b3-date"><input type="date" id="b3Dpa"><button id="b3Ok">Mettre à jour</button></div>
  <p class="b3-note">Modèle 3D « Human Fetus / Stages of fetal development » par arloopa, affiché avec le lecteur Sketchfab. Information générale : votre équipe de soins reste votre référence.</p>
  <p id="b3Liste" hidden></p><p id="b3Debug" hidden></p>
</main>
<script src="bebe-donnees.js?v=114"></script>
<script src="bebe-3d.js?v=114"></script>
<script>
const $=id=>document.getElementById(id),DAY=864e5;
if(/bebe3d=debug/.test(location.search)){$('b3Liste').hidden=false;$('b3Debug').hidden=false}
let dpa=null;try{dpa=localStorage.getItem('sere-b3-dpa')}catch(e){}
if(!dpa){const d=new Date(Date.now()+140*DAY);dpa=d.toISOString().slice(0,10)}
$('b3Dpa').value=dpa;
function semaineActuelle(){const lmp=new Date(new Date(dpa+'T00:00:00').getTime()-280*DAY);const j=Math.floor((Date.now()-lmp)/DAY);return Math.max(4,Math.min(42,Math.floor(j/7)+1))}
let actu=semaineActuelle(),w=actu;
function afficher(){$('b3Titre').textContent='Semaine '+w;$('b3Pill').hidden=(w!==actu);
  $('b3Prev').disabled=w<=4;$('b3Next').disabled=w>=42;$('b3Texte').innerHTML=bebe3dTexte(w);bebe3dMontrer(w)}
$('b3Prev').onclick=()=>{w--;afficher()};$('b3Next').onclick=()=>{w++;afficher()};
$('b3Ok').onclick=()=>{const v=$('b3Dpa').value;if(!v)return;dpa=v;try{localStorage.setItem('sere-b3-dpa',v)}catch(e){}actu=semaineActuelle();w=actu;afficher()};
let peau=0;try{peau=+(localStorage.getItem('sere-b3-peau')||0)}catch(e){}
function peaux(){$('b3Peaux').innerHTML=BEBE3D_PEAUX.map((p,i)=>'<button style="background:'+p[2]+'" aria-label="'+p[0]+'" title="'+p[0]+'" aria-pressed="'+(i===peau)+'" data-i="'+i+'"></button>').join('')}
$('b3Peaux').onclick=e=>{const b=e.target.closest('button');if(!b)return;peau=+b.dataset.i;try{localStorage.setItem('sere-b3-peau',peau)}catch(x){}peaux();bebe3dPeau(peau)};
peaux();_b3.peau=peau;bebe3dMonter($('b3Scene'),w);afficher();
</script>
</body>
</html>
